name: Node.js CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test-and-build:
    # Always use Ubuntu/Linux runners to keep builds fast and completely free
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Setup Node.js Environment
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: 'npm'

    - name: Install Dependencies
      run: npm ci

    - name: Run Automated Application Tests
      run: npm test

    - name: Setup Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build Local Docker Image Verification
      uses: docker/build-push-action@v5
      with:
        context: .
        push: false
        tags: sample-js-docker-app:latest
